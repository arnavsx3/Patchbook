name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json
          cache: true
          cache-dependency-path: '**/packages.lock.json'
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - name: Install CSS and browser tooling
        run: npm ci
      - name: Check formatting, build, test, and audit
        run: make check
      - name: Install test browser
        run: npx playwright install --with-deps chromium
      - name: Test the published application
        run: make e2e
      - name: Save browser failure traces
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: browser-traces
          path: test-results/
          if-no-files-found: ignore
          retention-days: 7
